<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Outer glow -->
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#539fe5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#539fe5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#g)"/>
  <!-- Rings -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#539fe5" stroke-width="1.5" opacity="0.3"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#539fe5" stroke-width="1.5" opacity="0.5"/>
  <!-- Core -->
  <circle cx="16" cy="16" r="5.5" fill="#0972d3"/>
  <!-- S letter -->
  <text x="16" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="10" fill="#fff">S</text>
</svg>
