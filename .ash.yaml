      path: "infra-terraform/modules/event-api/main.tf"
      reason: "[DEFERRED TO PROD (observability)] X-Ray tracing deferred; CloudWatch logs provide sufficient observability for this toolkit. Same control as CKV_AWS_50."
    - rule_id: terraform.aws.security.aws-secretsmanager-secret-unencrypted.aws-secretsmanager-secret-unencrypted
      path: "infra-terraform/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Encryption enabled with AWS-managed keys; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_149."

    # === checkov (documented IaC baseline — see assumption A015 in docs/threat-model.md) ===
    # --- socialagent-admin-console/infra-terraform/modules/api/main.tf ---
    - rule_id: CKV2_AWS_62
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (durability)] S3 event notifications are an integration/ops control; not configured in the default baseline."
    - rule_id: CKV_AWS_115
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (concurrency)] Function-level reserved concurrency is a prod tuning/DoS-isolation control; default unreserved concurrency in this toolkit."
    - rule_id: CKV_AWS_117
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[OUT OF SCOPE] Admin console is a separate management-plane app with no VPC infrastructure; data-plane egress isolation (threat model M3) applies to the agent runtime + event-ingestion Lambdas, not the management UI backend."
    - rule_id: CKV_AWS_116
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[ACCEPTED] No DLQ: API Gateway invokes the admin API backend Lambda synchronously, so a failure returns to the caller. A DLQ only receives failed asynchronous invocations."
    - rule_id: CKV_AWS_144
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (durability)] S3 cross-region replication is a prod DR control; not enabled in the default baseline."
    - rule_id: CKV_AWS_145
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Default encryption is SSE-S3 (Amazon S3 managed keys); a customer-managed KMS key is recommended for prod when the customer key policy requires it."
    - rule_id: CKV_AWS_158
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[FALSE POSITIVE] The backend log group is encrypted with the console's customer-managed key: the root module always passes aws_kms_key.main (rotation on; its policy grants CloudWatch Logs on /aws/lambda/<prefix>-*), but checkov reads the module variable's empty default and resolves kms_key_id to null."
    - rule_id: CKV_AWS_173
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Lambda env vars encrypted with AWS-managed key; customer-managed CMK recommended for prod when customer key policy requires it."
    - rule_id: CKV_AWS_272
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (code signing)] Lambda code signing requires an organizational signing profile / CI setup; left to the deployer's release process (threat model M4, A013)."
    - rule_id: CKV_AWS_338
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (observability)] Log retention <1yr in this toolkit; prod should extend retention per compliance requirements."
