# =============================================================================
# ASH (Automated Security Helper) configuration for SMART
# =============================================================================
# Suppressions below are the documented security-scan baseline for this
# toolkit. Each entry's reason states its category and rationale. Categories:
#
#   [FALSE POSITIVE]      Tool cannot see the actual (safe) configuration.
#   [REQUIRED BY DESIGN]  The flagged setting is needed for the toolkit to work.
#   [BY DESIGN ...]       Intentional architectural choice for this toolkit.
#   [ACCEPTED]            Control satisfied by an equivalent mechanism.
#   [ACCEPTED RISK]       Control intentionally NOT implemented in this toolkit;
#                         the residual risk is documented and accepted (see
#                         threat model). Production deployments should evaluate it.
#   [DEFERRED TO PROD ...] Real hardening that production deployments should
#                          apply; out of scope for the default baseline.
#
# Each entry is scoped to a specific (rule_id, path) pair, so a NEW rule, or the
# SAME rule in a NEW file, is NOT silenced and will surface on the next scan.
#
# NOTE: CKV_AWS_27 (SQS DLQ encryption) is fixed in the Terraform (SSE-SQS on
# every DLQ) and is intentionally absent here (no suppression). CKV_AWS_117
# (Lambdas in VPC) is NOT fixed: VPC-based egress isolation is not part of the
# default baseline and is an [ACCEPTED RISK] (see the data-plane Lambda module
# entries below and the threat-model T5/T6 rationale).
# =============================================================================
project_name: social-messaging-agent-runtime-toolkit
fail_on_findings: true

global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    # Local `terraform init` provider cache: gitignored, never committed or scanned in CI.
    # grype flags Go-stdlib CVEs baked into HashiCorp's distributed provider binaries
    # (archive/null/random) — third-party vendored binaries we cannot remediate.
    - path: "**/.terraform/**"
      reason: "[OUT OF SCOPE] Local terraform-init provider-binary cache (gitignored, not in repo/CI); CVEs live in HashiCorp's distributed Go binaries, not project code."
    # Local Python virtualenv: gitignored, never committed or scanned in CI. grype
    # flags CVEs in the pip that bootstraps the venv (pip-*.dist-info) — a local
    # developer tool, not a dependency of the shipped toolkit.
    - path: "**/.venv/**"
      reason: "[OUT OF SCOPE] Local Python virtualenv (gitignored, not in repo/CI); CVEs are in the bootstrap pip, not project code or its declared dependencies."
  suppressions:
    # === bandit: justified crypto/urllib uses (replaces ineffective inline "# noqa"; ===
    # === bandit honors "# nosec", not Ruff's "# noqa", so suppressions live here)     ===
    - rule_id: B303
      path: "src/socialagent/providers/eum_social.py"
      reason: "[REQUIRED BY DESIGN] SHA1 is mandated by the AWS SNS message-signature verification scheme, not used as a security hash"
    - rule_id: B303
      path: "tests/test_hardening.py"
      reason: "[TEST FIXTURE] SHA1 signs a synthetic SNS envelope to exercise the verifier against AWS's PKCS1v15+SHA1 scheme; test-only, mirrors the mandated production scheme in eum_social.py"
    - rule_id: B310
      path: "src/socialagent/media/transcriber.py"
      reason: "[FALSE POSITIVE] urlopen targets only the transcript URI returned by Amazon Transcribe, not user input"
    - rule_id: B310
      path: "tests/test_cli_packaging.py"
      reason: "[TEST FIXTURE] urlopen polls a scaffolded agent's health check at the fixed localhost URL http://127.0.0.1:8080/ping, not user input"
    - rule_id: B102
      path: "tests/test_blueprint_scheduler_tools.py"
      reason: "[TEST FIXTURE] exec runs one function read from the repo's own blueprints/appointment-scheduler/agent.py, which cannot be imported because it starts the server at module level; no external input"
    - rule_id: B102
      path: "tests/test_appointment_scheduler_cancel_confirmation.py"
      reason: "[TEST FIXTURE] exec runs one function read from the repo's own blueprints/appointment-scheduler/agent.py, which cannot be imported because it starts the server at module level; no external input"

    # === detect-secrets ===
    # Test fixtures and *.example templates hold fake values, so they are
    # suppressed per file below. Anywhere else, a false positive is allowlisted
    # on its own line with "# pragma: allowlist secret" instead of here, so the
    # rest of that file is still scanned.
    - rule_id: SECRET-SECRET-KEYWORD
      path: "infra-terraform/terraform.tfvars.example"
      reason: "[FALSE POSITIVE] Commented-out placeholder values in a *.example template; no real credential"
    - rule_id: SECRET-SECRET-KEYWORD
      path: "tests/test_cli_secrets.py"
      reason: "[TEST FIXTURE] Fake secret values written to and read back from a moto-mocked Secrets Manager; no real credential"
    - rule_id: SECRET-SECRET-KEYWORD
      path: "tests/test_cli_packaging.py"
      reason: "[TEST FIXTURE] Dummy AWS credentials so botocore builds requests in a scaffolded agent with AWS walled off; no real credential"
    - rule_id: SECRET-SECRET-KEYWORD
      path: "tests/test_cli_e2e.py"
      reason: "[TEST FIXTURE] Dummy AWS credentials for a CLI subprocess whose AWS endpoint stays on this machine; no real credential"
    - rule_id: SECRET-SECRET-KEYWORD
      path: "tests/test_event_api_authorizer.py"
      reason: "[TEST FIXTURE] Fake webhook secret and secret ARN fed to the event API authorizer through a stubbed Secrets Manager client; no real credential"

    # === semgrep / opengrep (both run the same registry rules, so one entry covers both) ===
    # ASH runs them with p/ci, which raises none of these. The entries cover the
    # wider registry packs (p/default, p/python, p/terraform, p/react) a reviewer
    # may run, so under the default p/ci config ASH lists them as unused. The
    # Terraform entries are the same controls checkov reports, with the same call.
    # GitHub Actions tag pinning and Dependabot cooldowns are fixed, not listed here.
    # --- python ---
    - rule_id: python.cryptography.security.insecure-hash-algorithms.insecure-hash-algorithm-sha1
      path: "src/socialagent/providers/eum_social.py"
      reason: "[REQUIRED BY DESIGN] SHA1 is mandated by the AWS SNS message-signature verification scheme (SignatureVersion 1), not used as a security hash; the same call bandit flags as B303"
    - rule_id: python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
      path: "src/socialagent/media/transcriber.py"
      reason: "[FALSE POSITIVE] urlopen targets only the transcript URI returned by Amazon Transcribe, not user input; the same call bandit flags as B310"
    - rule_id: python.flask.security.audit.app-run-security-config.avoid_using_app_run_directly
      path: "blueprints/minimal/agent.py"
      reason: "[FALSE POSITIVE] app is a bedrock_agentcore BedrockAgentCoreApp (Starlette on uvicorn), not Flask. app.run() is its documented entrypoint, serving /invocations and /ping on port 8080 in the AgentCore Runtime container; the app is built with debug at its False default"
    - rule_id: python.flask.security.audit.app-run-security-config.avoid_using_app_run_directly
      path: "blueprints/personal-assistant/agent.py"
      reason: "[FALSE POSITIVE] app is a bedrock_agentcore BedrockAgentCoreApp (Starlette on uvicorn), not Flask. app.run() is its documented entrypoint, serving /invocations and /ping on port 8080 in the AgentCore Runtime container; the app is built with debug at its False default"
    - rule_id: python.flask.security.audit.app-run-security-config.avoid_using_app_run_directly
      path: "blueprints/appointment-scheduler/agent.py"
      reason: "[FALSE POSITIVE] app is a bedrock_agentcore BedrockAgentCoreApp (Starlette on uvicorn), not Flask. app.run() is its documented entrypoint, serving /invocations and /ping on port 8080 in the AgentCore Runtime container; the app is built with debug at its False default"
    # --- terraform: IAM ---
    - rule_id: terraform.lang.security.iam.no-iam-creds-exposure.no-iam-creds-exposure
      path: "infra-terraform/modules/runtime/codebuild.tf"
      reason: "[REQUIRED BY DESIGN] CodeBuild needs ecr:GetAuthorizationToken to docker login before pushing the agent image. The action has no resource-level permissions, so Resource '*' is its only form; the push itself is scoped to the stack's repository by the ECRPushPull statement, or to this account and region's repositories when the deployer brings their own (A016)."
    - rule_id: terraform.lang.security.iam.no-iam-data-exfiltration.no-iam-data-exfiltration
      path: "infra-terraform/modules/runtime/codebuild.tf"
      reason: "[FALSE POSITIVE] The rule flags s3:GetObject in any policy that has a Resource '*' statement anywhere. Here s3:GetObject is scoped to the agent source bucket (or its key prefix in the shared artifacts bucket); the only '*' statement is ecr:GetAuthorizationToken, which has no resource-level permissions."
    - rule_id: terraform.lang.security.iam.no-iam-data-exfiltration.no-iam-data-exfiltration
      path: "infra-terraform/modules/templates/main.tf"
      reason: "[FALSE POSITIVE] The rule flags s3:GetObject in any policy that has a Resource '*' statement anywhere. Here s3:GetObject is scoped to the template source bucket (or its key prefix in the shared artifacts bucket); the only '*' statement is the social-messaging template actions (see CKV_AWS_355 below)."
    - rule_id: terraform.lang.security.iam.no-iam-data-exfiltration.no-iam-data-exfiltration
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[FALSE POSITIVE] The rule flags S3 and Secrets Manager reads in any policy that has a Resource '*' statement anywhere. Here s3:GetObject is scoped to the registry bucket and GetSecretValue to this account's *-event-webhook-secret-* entries; the '*' statements are actions such as cloudwatch:GetMetricData and social-messaging:ListLinkedWhatsAppBusinessAccounts."
    - rule_id: terraform.lang.security.iam.no-iam-resource-exposure.no-iam-resource-exposure
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[REQUIRED BY DESIGN] The console updates an agent runtime's configuration, and UpdateAgentRuntime requires iam:PassRole on the runtime's execution role. PassRole is scoped to this account's *-agentcore-runtime roles, so the console cannot pass any other role."
    # --- terraform: same controls as the checkov entries below ---
    - rule_id: terraform.aws.security.aws-cloudfront-insecure-tls.aws-insecure-cloudfront-distribution-tls-version
      path: "socialagent-admin-console/infra-terraform/modules/frontend/main.tf"
      reason: "[DEFERRED TO PROD (CloudFront)] Viewer TLS >=1.2 is tied to a custom certificate (deferred); the default CloudFront certificate applies. Same control as CKV_AWS_174."
    - rule_id: terraform.aws.security.aws-cloudtrail-encrypted-with-cmk.aws-cloudtrail-encrypted-with-cmk
      path: "infra-terraform/modules/security-logging/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudTrail log files are encrypted with SSE-S3 (the audit bucket's default); a customer-managed KMS key is recommended for prod when the customer key policy requires it. Same control as CKV_AWS_35."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/modules/event-api/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/modules/monitoring/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/modules/observability/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/modules/runtime/codebuild.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/modules/security-logging/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/modules/templates/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-cloudwatch-log-group-unencrypted.aws-cloudwatch-log-group-unencrypted
      path: "infra-terraform/packaging.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] CloudWatch log group uses default encryption; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_158."
    - rule_id: terraform.aws.security.aws-codebuild-project-unencrypted.aws-codebuild-project-unencrypted
      path: "infra-terraform/modules/runtime/codebuild.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] No encryption_key, so CodeBuild uses the AWS-managed aws/s3 key. Both projects declare NO_ARTIFACTS and log only to CloudWatch, with no S3 cache, so there is no build output for a CMK to protect; customer-managed CMK recommended for prod when customer key policy requires it."
    - rule_id: terraform.aws.security.aws-codebuild-project-unencrypted.aws-codebuild-project-unencrypted
      path: "infra-terraform/modules/templates/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] No encryption_key, so CodeBuild uses the AWS-managed aws/s3 key. The project declares NO_ARTIFACTS and logs only to CloudWatch, with no S3 cache, so there is no build output for a CMK to protect; customer-managed CMK recommended for prod when customer key policy requires it."
    - rule_id: terraform.aws.security.aws-codebuild-project-unencrypted.aws-codebuild-project-unencrypted
      path: "infra-terraform/packaging.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] No encryption_key, so CodeBuild uses the AWS-managed aws/s3 key. The project declares NO_ARTIFACTS and logs only to CloudWatch, with no S3 cache, so there is no build output for a CMK to protect; customer-managed CMK recommended for prod when customer key policy requires it."
    - rule_id: terraform.aws.security.aws-dynamodb-table-unencrypted.aws-dynamodb-table-unencrypted
      path: "infra-terraform/bootstrap/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Encryption enabled with AWS-managed keys; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_119."
    - rule_id: terraform.aws.security.aws-ecr-mutable-image-tags.aws-ecr-mutable-image-tags
      path: "infra-terraform/modules/runtime/main.tf"
      reason: "[DEFERRED TO PROD (code signing)] ECR immutable tags are a prod release-integrity control; the toolkit pushes mutable tags during iterative deploys. Same control as CKV_AWS_51."
    - rule_id: terraform.aws.security.aws-lambda-environment-unencrypted.aws-lambda-environment-unencrypted
      path: "infra-terraform/modules/event-api/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Lambda env vars encrypted with AWS-managed key; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_173."
    - rule_id: terraform.aws.security.aws-lambda-environment-unencrypted.aws-lambda-environment-unencrypted
      path: "infra-terraform/modules/lambdas/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Lambda env vars encrypted with AWS-managed key; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_173."
    - rule_id: terraform.aws.security.aws-lambda-environment-unencrypted.aws-lambda-environment-unencrypted
      path: "socialagent-admin-console/infra-terraform/modules/api/main.tf"
      reason: "[DEFERRED TO PROD (KMS-CMK)] Lambda env vars encrypted with AWS-managed key; customer-managed CMK recommended for prod when customer key policy requires it. Same control as CKV_AWS_173."
