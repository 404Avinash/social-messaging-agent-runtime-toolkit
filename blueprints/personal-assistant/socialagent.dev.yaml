schema_version: 3
project: __project_name__
environment: dev
region: us-east-1
deployment_type: docker
blueprint: personal-assistant

whatsapp:
  phone_number_id: ""        # EUM Social phone number ARN
  templates: templates.yaml  # synced to Meta on deploy

# error_messages:
#   throttle: ""
#   validation: ""
#   generic: ""
#   timeout: ""

features:
  scheduler_lambda: true   # handlers/scheduler.py registers @app.on_schedule handlers; without this Lambda they never run
  state_table: true        # remember/recall keep per-user state; without the table it is a file in the container, gone when the session ends

# Any other variable in infra-terraform/variables.tf, verbatim:
terraform:
  # What the user receives when the guardrail blocks a message or a reply. The
  # defaults are English; this bot's templates and reminders are Spanish (see
  # "The guardrail policy" in docs/configuration.md).
  guardrail_blocked_input_message: "Lo siento, no puedo ayudarte con esa solicitud. ¿En qué más puedo ayudarte?"
  guardrail_blocked_output_message: "Lo siento, no puedo compartir esa información. ¿Necesitas ayuda con algo más?"
  enable_force_destroy: true   # dev: buckets can be deleted with their contents
  transcribe_languages: [es-MX, en-US]   # voice notes: identify among these only; a one-word note is misread with no hint

outputs: {}
